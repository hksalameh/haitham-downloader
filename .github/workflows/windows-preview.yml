name: Windows preview EXE

on:
  pull_request:
    paths:
      - 'app.py'
      - 'engine.py'
      - 'ranges.py'
      - 'desktop_shell.py'
      - 'web/**'
      - 'HaithamDownloader_Classic_425_Dynamic.spec'
      - '.github/workflows/windows-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build isolated Windows preview
        run: python -m PyInstaller --noconfirm HaithamDownloader_Classic_425_Dynamic.spec
      - name: Smoke-test the actual executable without aria2
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/HaithamDownloader_Classic_425_Dynamic.exe').Path
          $testDir = Join-Path $PWD 'preview-ci-state'
          $p = Start-Process -FilePath $exe -ArgumentList @('--headless', '--port', '18798', '--data-dir', "`"$testDir`"") -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18798/health' -TimeoutSec 2
                if ($health.ok) { $healthy = $true; break }
              } catch {}
              if ($p.HasExited) { break }
            }
            if (-not $healthy) { throw 'Preview EXE failed to start its local engine' }
            $page = (Invoke-WebRequest -Uri 'http://127.0.0.1:18798/' -TimeoutSec 5).Content
            if ($page -notmatch 'max="32"') { throw 'Preview EXE has stale UI assets' }
            Write-Output 'PASS_EXE_HEALTH_AND_CURRENT_UI'
          } finally {
            & taskkill.exe /PID $p.Id /T /F 2>$null | Out-Null
          }
      - name: Record SHA-256
        shell: pwsh
        run: |
          $file = 'HaithamDownloader_Classic_425_Dynamic.exe'
          $sha = (Get-FileHash "dist/$file" -Algorithm SHA256).Hash
          "$sha  $file" | Out-File -FilePath 'dist/SHA256SUMS.txt' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: HaithamDownloader-425-Dynamic-preview
          path: |
            dist/HaithamDownloader_Classic_425_Dynamic.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
